name: UI Media Check

on:
  workflow_call:

jobs:
  check-ui-media:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check for screenshots or videos on UI PRs
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;

            // Skip bot PRs (e.g., Dependabot, Crowdin)
            if (pr.user && pr.user.type === "Bot") return;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const uiExt = /\.(tsx|jsx|css|scss|html)$/i;
            const hasUiChanges = files.some((f) => uiExt.test(f.filename));

            const marker = "<!-- ui-media-check -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (!hasUiChanges) {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
              }
              return;
            }

            const body = pr.body || "";
            const hasMedia =
              /!\[[^\]]*\]\([^)]+\)/.test(body) ||
              /<img\b[^>]*src=/i.test(body) ||
              /<video\b/i.test(body) ||
              /https:\/\/github\.com\/user-attachments\/assets\//i.test(body) ||
              /https:\/\/user-images\.githubusercontent\.com\//i.test(body);

            if (hasMedia) {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
              }
              core.info("UI media found in PR description.");
              return;
            }

            const reminder = [
              marker,
              "### 📸 UI Media Reminder",
              "",
              "This PR modifies UI files (`.tsx`, `.jsx`, `.css`, `.scss`, or `.html`), but no screenshots or videos were found in the PR description.",
              "",
              "Please drag and drop a **Before / After screenshot, GIF, or short video** into the PR description to help reviewers verify the visual changes. This reminder will disappear automatically once media is added.",
            ].join("\n");

            if (!existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: reminder,
              });
            }
